# Agent Configuration Template

This template defines the structure for agent-specific configuration overrides.
Copy this file and customize for each agent.

```yaml
# <agent-name> Configuration
# Inherits from: configs/shared/base.yaml + configs/shared/safety.yaml
# Override values below

agent:
  name: "<agent-name>"
  developer: "<developer>"
  
defaults:
  # Override shared defaults if needed
  max_turns: 50
  timeout_minutes: 30
  
  # Agent-specific defaults
  model: "<default-model>"
  temperature: 0.7
  
  # Sandbox mode (if supported)
  sandbox:
    enabled: true  # or false if not supported

safety:
  # Agent-specific safety overrides
  # Inherits all rules from configs/shared/safety.yaml
  
  # Additional denied commands if needed
  extra_denied_commands: []
  
  # Override filesystem restrictions if needed
  extra_deny_patterns: []

# Environment variables required by this agent
environment:
  required:
    - "API_KEY_VAR"   # TODO: replace with actual variable name
  optional:
    - "PROXY_URL"
    
# Agent-specific configuration
# TODO: Add agent-specific settings here
```
