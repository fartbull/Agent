# Workflow Template

This template defines the structure for reusable agent workflows.
Copy this file and customize for each workflow.

```yaml
# Workflow: <workflow-name>
# Description: <Brief description of what this workflow does>
# Compatible agents: <list of agent names that support this workflow>

workflow:
  name: "<workflow-name>"
  description: "<Brief description>"
  version: "1.0.0"

steps:
  - name: "Prepare environment"
    description: "Set up the working environment"
    actions:
      - type: "shell"
        command: "<setup command>"
      - type: "file_check"
        path: "<file to verify>"
        
  - name: "Read source files"
    description: "Load relevant code into context"
    actions:
      - type: "read"
        path: "<file to read>"
        
  - name: "Execute task"
    description: "<What the agent should do>"
    actions:
      - type: "prompt"
        content: |
          <Task description for the agent>
          
  - name: "Verify results"
    description: "Run tests/build/lint"
    actions:
      - type: "shell"
        command: "<verification command>"
      - type: "expect_exit"
        code: 0

# Safety guardrails for this workflow
safety:
  # Commands this workflow is allowed to run
  allowed_commands:
    - "<command>"
  # Commands explicitly denied
  denied_commands:
    - "rm -rf"
    - "sudo"
    
# Expected output
output:
  type: "files"  # or "text", "report"
  artifacts:
    - path: "<output file>"
      description: "<what this file contains>"
```
